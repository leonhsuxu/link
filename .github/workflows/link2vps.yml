# ============================================================================
# 版本：V02.r1（公库运行私库版）
#
# 架构：
#   - 本 yml 唯一存放于公库 leonhsuxu/link/.github/workflows/
#     → Actions 分钟按公库计 = 无限免费，不消耗任何私库额度
#   - 代码 / mmdb / json 缓存 / 频道列表 / 凭据 / 全部产物 → 私库 leonhsuxu/VPSscript
#   - 每个作业先克隆私库（PRIV_PAT），再在 _priv/ 内运行，路径语义与原私库版一致
#   - 凭据不再使用 ${{ secrets.* }}（secrets 不能跨仓库引用），
#     改为运行时读取私库 TelegramNode/.secrets.env 并 ::add-mask:: 打码
#   - merge 产物统一回推私库 VPSscript 原目录；Gist 订阅地址与原先完全一致
#
# 前置配置（一次性）：
#   1) Fine-grained PAT：仅授权仓库 leonhsuxu/VPSscript，权限 Contents: Read and write
#      → 存到公库 link → Settings → Secrets and variables → Actions → Secrets
#         名称：PRIV_PAT
#   2) 私库 VPSscript 新增 TelegramNode/.secrets.env（模板见随附文件）并提交
#   3) 公库中不要放任何其它文件（无需 README 也可运行）
#
# ⚠️ 公库运行日志全网可见：已对 SESSION/HASH/GIST_TOKEN 做 add-mask；
#    nodes-cache artifact 在私库 .secrets.env 设置 ART_PASS 后自动加密上传。
# ============================================================================

name: 📚 [Gist]Publiclink.All.Test_多版本
# ==================== 触发条件配置 ====================
# TCP、Clash、XCspeedtest 三合一测速版
#
# 🧩 矩阵分片版（方案 E + A + C，两阶段：抓取 / 测速分离）：
#   - prepare      ：根据 SHARD_TOTAL 生成矩阵 [0,1,...,N-1]
#   - scrape      ：【单 job】只抓取+解析+清洗+全局命名一次，导出 nodes_cache/all_nodes.json（artifact）
#                   彻底消除「多分片同时用同一 Telegram session 从不同 IP 登录 → session 被封」的问题
#   - speedtest   ：【矩阵 N 片】每片读取同一份 all_nodes.json，确定性切片后各自 IP 验证 + 测速 + 命名
#   - merge       ：等所有分片完成后，汇总 YAML + ip_cache，统一【回推私库】并同步 Gist
on:
  # 定时执行配置北京时间5:27
  schedule:
    - cron: '27 21 * * *'
  # 支持手动触发工作流，附带输入参数
  workflow_dispatch:
    inputs:
      warp_config:
        description: '选择网络配置模式'
        required: false
        default: 'default'
        type: choice
        options:
          - default        # 默认配置
          - all_warp       # 全流程使用Warp网络
          - all_github     # 全流程使用GitHub网络
          - test_mode      # 测试模式：仅抓取部分频道，使用Warp测速
      force_download:
        description: '强制重下载工具'
        required: false
        default: false
        type: boolean
      speedtest_mode:
        description: '选择测速模式'
        required: false
        default: 'tcp_clash_xc'
        type: choice
        options:
          - tcp_only         # 纯 TCP 测速
          - tcp_clash        # TCP 粗筛 → Clash 测速
          - clash_only       # 纯 Clash 测速
          - xcspeedtest_only # 备用 纯 Speedtest 测速（xcspeedtest）,超慢
          - tcp_xc           # 备用 TCP 粗筛 → Speedtest 测速，超慢
          - tcp_clash_xc     # 备用 TCP 粗筛 → Clash测速 → XC|Speedtest 测速
      enable_tcp_log:
        description: '是否开启TCP日志'
        required: false
        default: false
        type: boolean
      enable_speedtest_log:
        description: '是否显示测试日志'
        required: false
        default: false
        type: boolean
      enable_speedtest_tables:
        description: '是否显示测速结果'
        required: false
        default: false
        type: boolean
      shard_total:
        description: '矩阵分片数量（并发 job 数）'
        required: false
        default: '20'
        type: string

# ==================== 并发控制（关键：保护 Telegram session）====================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# ==================== 环境变量配置 ====================
env:
  # ==================== 版本 / 仓库配置 ====================
  WORKFLOW_VERSION: "V02.r1"
  PRIV_REPO: "leonhsuxu/VPSscript"       # 私库（代码+数据+凭据+产物）
  PRIV_BRANCH: "master"                  # 私库默认分支（若为 main 请改这里）
  GIST_USER: "leonhsuxu"                 # Gist 账号（定时运行时 github.actor 不可靠，故写死）
  MIHOMO_VERSION: v1.19.21           # Mihomo (Clash Meta) 版本
  SPEEDTEST_VERSION: v0.4.17          # XC Speedtest 版本
  WGCF_VERSION: v2.3.0              # WGCF (Cloudflare Warp) 版本
  CLASH_SPEEDTEST_VERSION: v1.8.6    # Clash-speedtest 核心版本
  # ==================== 网络控制配置 默认网络配置====================
  WARP_FOR_SCRAPING: "false"
  WARP_FOR_PARSING: "true"
  WARP_FOR_TCP: "true"
  WARP_FOR_SPEEDTEST: "true"
  WARP_FOR_FINAL: "false"
  # ==================== 测速策略配置 ====================
  DETAILED_SPEEDTEST_MODE: "tcp_xc"       # 定时运行的默认模式
  # ==================== 带宽筛选配置 ====================
  ENABLE_BANDWIDTH_FILTER: "true"
  # ==================== 日志配置 ====================
  ENABLE_TCP_LOG: "false"
  MAX_LOG_NUMBER: '50'
  ENABLE_SPEEDTEST_LOG: "false"
  ENABLE_SPEEDTEST_TABLES: "false"
  # ==================== 矩阵分片配置 ====================
  # 公开库 ubuntu-latest = 4 vCPU/16GB，建议 16–24；免费账号并发上限 20
  SHARD_TOTAL: "20"

# ==================== 工作流任务定义 ====================
jobs:
  # ---------------------------------------------------------------------------
  # 0) prepare：根据 SHARD_TOTAL 生成矩阵 [0,1,...,N-1]
  # ---------------------------------------------------------------------------
  prepare:
    name: 🧩 准备分片矩阵
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.gen.outputs.shard_matrix }}
    steps:
      - id: gen
        name: 生成分片矩阵
        run: |
          if [ -n "${{ inputs.shard_total }}" ]; then
            N="${{ inputs.shard_total }}"
          else
            N="${{ env.SHARD_TOTAL }}"
          fi
          N=$((N + 0))
          if [ "$N" -lt 1 ]; then N=1; fi
          arr=$(seq -s, 0 $((N - 1)))
          echo "shard_matrix=[$arr]" >> "$GITHUB_OUTPUT"
          echo "🧩 分片总数 SHARD_TOTAL=$N，矩阵=$arr"

  # ---------------------------------------------------------------------------
  # 1) scrape：单 job，只抓取一次 → 导出 all_nodes.json（供分片复用）
  # ---------------------------------------------------------------------------
  scrape:
    name: 抓取并导出节点
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 克隆私库 VPSscript（代码/数据/凭据）
        env:
          PRIV_PAT: ${{ secrets.PRIV_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${PRIV_PAT}@github.com/${PRIV_REPO}.git" _priv
          cd _priv && git checkout "${PRIV_BRANCH}" 2>/dev/null || true
          echo "✅ 私库已克隆："; ls

      - name: 校验私库凭据文件
        run: |
          if [ ! -f "_priv/TelegramNode/.secrets.env" ]; then
            echo "❌ 缺少 _priv/TelegramNode/.secrets.env"
            echo "   请在私库 VPSscript 的 TelegramNode/ 下创建并提交该文件（模板见 .secrets.env.example）"
            echo "   至少需要：TELEGRAM_API_ID / TELEGRAM_API_HASH /（TELEGRAM_STRING_SESSION 或 tg_session_string.txt）/ GIST_TOKEN / GIST_ID"
            exit 1
          fi
          # 只检查「赋值行的值仍以占位符填入开头」，避免误伤头部说明注释里的“填入”字样
          if grep -nEq '^[A-Za-z_]+=[[:space:]]*填入' "_priv/TelegramNode/.secrets.env"; then
            echo "❌ .secrets.env 仍有未替换的占位符（形如 KEY=填入...），请填写真实值后提交到私库"
            exit 1
          fi
          echo "✅ 凭据文件存在"

      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '_priv/TelegramNode/requirements.txt'

      - name: 缓存 apt 包（避免重复下载系统依赖）
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-wireguard-curl-wget-resolvconf-v1
          restore-keys: |
            apt-${{ runner.os }}-
      - name: 安装 Python 依赖及系统依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r _priv/TelegramNode/requirements.txt
          sudo mkdir -p /var/cache/apt/archives
          if [ -d "$RUNNER_TEMP/apt-archives" ]; then
            sudo cp -f "$RUNNER_TEMP/apt-archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools curl resolvconf wget
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo cp -f /var/cache/apt/archives/*.deb "$RUNNER_TEMP/apt-archives/" 2>/dev/null || true

      - name: 缓存 wgcf 工具
        id: cache-wgcf
        uses: actions/cache@v6
        with:
          path: wgcf
          key: wgcf-linux-amd64-${{ env.WGCF_VERSION }}
          restore-keys: wgcf-linux-amd64-${{ env.WGCF_VERSION }}
      - name: 下载 wgcf 工具
        if: steps.cache-wgcf.outputs.cache-hit != 'true' || inputs.force_download == 'true'
        run: |
          WGCF_FULL_VERSION="${{ env.WGCF_VERSION }}"
          WGCF_FILENAME_VERSION="${WGCF_FULL_VERSION#v}"
          echo "正在下载 wgcf v${WGCF_FILENAME_VERSION}..."
          curl -fsSL -o wgcf "https://github.com/ViRb3/wgcf/releases/download/${WGCF_FULL_VERSION}/wgcf_${WGCF_FILENAME_VERSION}_linux_amd64"
          if [ ! -f "wgcf" ]; then
            echo "❌ 错误：wgcf 下载失败！"
            exit 1
          fi
          chmod +x wgcf
          echo "wgcf 下载完成。"

      - name: 抓取并导出节点（SCRAPE_ONLY）
        timeout-minutes: 110
        working-directory: ${{ github.workspace }}/_priv
        env:
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          DOWNLOAD_WORKERS: "12"
          DOWNLOAD_URL_BUDGET: "150"
          DOWNLOAD_TIMEOUT: "90"
          WARP_FOR_SCRAPING: ${{ env.WARP_FOR_SCRAPING }}
          WARP_FOR_PARSING: ${{ env.WARP_FOR_PARSING }}
          DETAILED_SPEEDTEST_MODE: ${{ inputs.speedtest_mode || env.DETAILED_SPEEDTEST_MODE }}
        run: |
          echo "=== 阶段[scraping]：抓取全部频道并导出节点 JSON ==="
          # —— 凭据来自私库 .secrets.env（secrets 不能跨仓库引用），并手动打码 ——
          set -a; . TelegramNode/.secrets.env; set +a
          if [ -n "$TELEGRAM_STRING_SESSION" ]; then echo "::add-mask::$TELEGRAM_STRING_SESSION"; fi
          if [ -n "$TELEGRAM_API_HASH" ]; then echo "::add-mask::$TELEGRAM_API_HASH"; fi
          if [ -n "$TELEGRAM_API_ID" ]; then echo "::add-mask::$TELEGRAM_API_ID"; fi
          # 会话串兜底：.secrets.env 留空时，自动读取私库内 tg_session_string.txt
          if [ -z "$TELEGRAM_STRING_SESSION" ]; then
            f=$(find . -name tg_session_string.txt -not -path './.git/*' | head -n1)
            if [ -n "$f" ]; then
              export TELEGRAM_STRING_SESSION="$(cat "$f")"
              echo "::add-mask::$TELEGRAM_STRING_SESSION"
              echo "ℹ️ 已从私库 $f 载入 STRING_SESSION"
            fi
          fi
          mkdir -p nodes_cache
          if [ -f "TelegramNode/TG_Chanel_ID.txt" ]; then
            export TELEGRAM_CHANNEL_IDS=$(cat TelegramNode/TG_Chanel_ID.txt)
            echo "✅ 已从 TG_Chanel_ID.txt 读取频道列表"
          else
            echo "❌ 错误：TelegramNode/TG_Chanel_ID.txt 文件不存在！"
            exit 1
          fi
          # SCRAPE_ONLY=true：抓取+解析+清洗+全局命名后仅导出 nodes_cache/all_nodes.json 即返回
          SCRAPE_ONLY=true python TelegramNode/TG-Link.All.Test.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ 抓取阶段失败，退出码: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          if [ ! -f "nodes_cache/all_nodes.json" ]; then
            echo "❌ 未生成 nodes_cache/all_nodes.json，抓取可能无节点"
            exit 1
          fi
          echo "✅ 抓取完成，节点数：$(python -c "import json;print(len(json.load(open('nodes_cache/all_nodes.json'))))")"

      - name: 确保网络正常
        if: always()
        run: |
          echo "=== 🔧 确保网络正常（scrape）==="
          sudo wg-quick down wgcf 2>/dev/null || echo "   ℹ️ WARP未运行"
          sudo ip link delete wgcf 2>/dev/null || echo "   ℹ️ 接口不存在"
          for cidr in \
            "140.82.112.0/20" "185.199.108.0/22" "185.199.109.0/22" \
            "185.199.110.0/22" "185.199.111.0/22" "192.30.252.0/22" \
            "192.30.253.0/22" "192.30.254.0/22" "192.30.255.0/22"; do
            sudo ip route del $cidr 2>/dev/null || true
          done
          echo "=== 网络检查完成 ==="

      - name: 打包节点缓存（设置 ART_PASS 后自动加密，防公网下载）
        run: |
          set -a; . _priv/TelegramNode/.secrets.env; set +a
          if [ -n "$ART_PASS" ]; then echo "::add-mask::$ART_PASS"; fi
          tar czf nodes_cache.tgz -C _priv nodes_cache
          if [ -n "$ART_PASS" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ART_PASS -in nodes_cache.tgz -out nodes_cache.tgz.enc
            rm -f nodes_cache.tgz
            echo "🔐 节点缓存已加密（ART_PASS 生效）"
          else
            echo "⚠️ 未设置 ART_PASS，节点缓存明文上传（公库 artifact 全网可下载，建议在 .secrets.env 配置 ART_PASS）"
          fi

      - name: 上传节点缓存（供分片复用）
        uses: actions/upload-artifact@v7
        with:
          name: nodes-cache
          path: nodes_cache.tgz*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 1.5) setup：单 job，构建一次「工具链」（Python 依赖 + mihomo/wgcf/xcspeedtest/
  #      clash-speedtest 四个二进制），打包为 artifact 供所有测速分片共享。
  # ---------------------------------------------------------------------------
  setup:
    name: 构建共享工具链
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 克隆私库 VPSscript
        env:
          PRIV_PAT: ${{ secrets.PRIV_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${PRIV_PAT}@github.com/${PRIV_REPO}.git" _priv
          cd _priv && git checkout "${PRIV_BRANCH}" 2>/dev/null || true

      - name: 缓存 apt 包（避免重复下载系统依赖）
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-wireguard-curl-wget-resolvconf-v1
          restore-keys: |
            apt-${{ runner.os }}-
      - name: 安装系统工具（wg-quick / curl 等）
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d "$RUNNER_TEMP/apt-archives" ]; then
            sudo cp -f "$RUNNER_TEMP/apt-archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools curl resolvconf wget
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo cp -f /var/cache/apt/archives/*.deb "$RUNNER_TEMP/apt-archives/" 2>/dev/null || true
      - name: 安装 Python 依赖到 pylibs（--target，便于跨 runner 移植）
        run: |
          python3 -m pip --version || sudo apt-get install -y python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install --target=pylibs -r _priv/TelegramNode/requirements.txt
      - name: 下载 Mihomo
        run: |
          set -e
          TAG=${{ env.MIHOMO_VERSION }}
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-${TAG}.gz"
          if ! curl --head --fail "$URL"; then echo "❌ Mihomo 下载地址不可用"; exit 1; fi
          wget --tries=3 --timeout=30 -O mihomo.gz "$URL"
          gunzip -f mihomo.gz && chmod +x mihomo && ./mihomo -v
      - name: 下载 wgcf
        run: |
          WGCF_FULL_VERSION="${{ env.WGCF_VERSION }}"
          WGCF_FILENAME_VERSION="${WGCF_FULL_VERSION#v}"
          curl -fsSL -o wgcf "https://github.com/ViRb3/wgcf/releases/download/${WGCF_FULL_VERSION}/wgcf_${WGCF_FILENAME_VERSION}_linux_amd64"
          chmod +x wgcf
      - name: 下载 xcspeedtest (speedtest-clash)
        run: |
          set -e
          RELEASE_TAG=${{ env.SPEEDTEST_VERSION }}
          URL=$(curl -s "https://api.github.com/repos/xiecang/speedtest-clash/releases/tags/${RELEASE_TAG}" \
                | grep "browser_download_url.*speedtest-clash_Linux_x86_64" | cut -d '"' -f4)
          if [ -z "$URL" ]; then
            URL=$(curl -s https://api.github.com/repos/xiecang/speedtest-clash/releases/latest \
                | grep "browser_download_url.*speedtest-clash_Linux_x86_64" | cut -d '"' -f4)
          fi
          if [ -z "$URL" ]; then echo "❌ 未找到 speedtest-clash 下载 URL"; exit 1; fi
          wget --tries=5 --timeout=60 -O downloaded_file "$URL"
          if file downloaded_file | grep -q "gzip compressed data"; then
            tar -xzf downloaded_file && mv speedtest-clash xcspeedtest && rm downloaded_file
          else
            mv downloaded_file xcspeedtest
          fi
          chmod +x xcspeedtest && ./xcspeedtest --help
      - name: 下载 clash-speedtest 核心
        run: |
          set -e
          mkdir -p clash_core
          URL="https://github.com/faceair/clash-speedtest/releases/download/${{ env.CLASH_SPEEDTEST_VERSION }}/clash-speedtest_Linux_x86_64.tar.gz"
          echo "下载：$URL"
          wget -q -O clash-speedtest.tar.gz "$URL"
          tar -xzf clash-speedtest.tar.gz -C clash_core
          rm -f clash-speedtest.tar.gz
          # 兼容 tarball 内二进制命名（clash-speedtest / clash / 子目录），统一重命名为 clash
          if [ ! -f clash_core/clash ]; then
            BIN=$(find clash_core -type f -name 'clash-speedtest*' 2>/dev/null | head -n1)
            if [ -z "$BIN" ]; then
              echo "❌ 未在 clash_core/ 中找到 clash-speedtest 二进制，解包内容如下："
              ls -laR clash_core/
              exit 1
            fi
            mv "$BIN" clash_core/clash
          fi
          chmod +x clash_core/clash
          echo "✅ clash-speedtest 核心就绪："
          ls -la clash_core/
      - name: 打包工具链
        run: |
          tar -czf toolchain.tar.gz pylibs mihomo wgcf xcspeedtest clash_core
          ls -lh toolchain.tar.gz
      - name: 上传工具链 artifact
        uses: actions/upload-artifact@v7
        with:
          name: toolchain
          path: toolchain.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2) speedtest：矩阵并行测速，每片只测自己那一份节点，产物上传为 artifact
  # ---------------------------------------------------------------------------
  speedtest:
    name: 测速分片 ${{ matrix.shard }}
    needs: [prepare, scrape, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20   # 1(scrape) + 1(setup) + 分片 ≤ 免费账号 20 并发上限
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shard_matrix) }}
    steps:
      # === 步骤1：克隆私库（脚本/数据/凭据） ===
      - name: 克隆私库 VPSscript
        env:
          PRIV_PAT: ${{ secrets.PRIV_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${PRIV_PAT}@github.com/${PRIV_REPO}.git" _priv
          cd _priv && git checkout "${PRIV_BRANCH}" 2>/dev/null || true

      # === 步骤2：恢复共享工具链（setup 构建，全分片复用；置于工作区根，不进 _priv） ===
      - name: 下载并解包共享工具链
        uses: actions/download-artifact@v8
        with:
          name: toolchain
          path: .
      - name: 解包工具链
        run: |
          tar -xzf toolchain.tar.gz
          rm -f toolchain.tar.gz
          python3 -c "import sys; print('python', sys.version.split()[0])"
          ls -la mihomo wgcf xcspeedtest clash_core/clash 2>/dev/null || true

      # === 步骤3：系统级工具（wg-quick / curl / wget / resolvconf） ===
      - name: 缓存 apt 包（避免重复下载系统依赖）
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-wireguard-curl-wget-resolvconf-v1
          restore-keys: |
            apt-${{ runner.os }}-
      - name: 安装系统级工具
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d "$RUNNER_TEMP/apt-archives" ]; then
            sudo cp -f "$RUNNER_TEMP/apt-archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools curl resolvconf wget
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo cp -f /var/cache/apt/archives/*.deb "$RUNNER_TEMP/apt-archives/" 2>/dev/null || true

      # === 步骤4：下载抓取阶段导出的节点缓存（支持 ART_PASS 加密） ===
      - name: 下载节点缓存（scrape 产物）
        uses: actions/download-artifact@v8
        with:
          name: nodes-cache
          path: .
      - name: 解密/解包节点缓存到 _priv
        run: |
          set -a; . _priv/TelegramNode/.secrets.env; set +a
          if [ -n "$ART_PASS" ]; then echo "::add-mask::$ART_PASS"; fi
          mkdir -p _priv/nodes_cache
          if [ -f nodes_cache.tgz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass env:ART_PASS -in nodes_cache.tgz.enc | tar xz -C _priv
            echo "🔐 已解密节点缓存"
          elif [ -f nodes_cache.tgz ]; then
            tar xzf nodes_cache.tgz -C _priv
          else
            echo "❌ 未找到节点缓存 artifact（nodes_cache.tgz / .enc 均缺失）"; exit 1
          fi
          if [ ! -f "_priv/nodes_cache/all_nodes.json" ]; then
            echo "❌ 解包后未找到 _priv/nodes_cache/all_nodes.json"; ls -la; exit 1
          fi
          echo "✅ 节点缓存就绪：$(du -h _priv/nodes_cache/all_nodes.json | cut -f1)"

      # === 步骤5：把工具链二进制软链进 _priv（脚本以 _priv 为根，路径语义与原版一致） ===
      - name: 软链工具链到 _priv
        run: |
          # 先校验工具链是否已在 $GITHUB_WORKSPACE 就绪（setup 构建 + 本 job 已解包）
          # 若 clash 二进制真的没构建出来，这里就明确报错并列出目录，便于定位，而不是在后面 ls 时才挂掉
          MISSING=0
          for f in mihomo wgcf xcspeedtest clash_core/clash; do
            if [ ! -e "$GITHUB_WORKSPACE/$f" ]; then
              echo "❌ 工具链缺失：$GITHUB_WORKSPACE/$f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "--- $GITHUB_WORKSPACE 目录内容 ---"
            ls -la "$GITHUB_WORKSPACE" || true
            echo "（请检查 setup job 是否成功构建 clash-speedtest 核心，或 toolchain artifact 是否完整解包）"
            exit 1
          fi

          # 软链文件型二进制（mihomo/wgcf/xcspeedtest）：直接整体覆盖为软链
          for b in mihomo wgcf xcspeedtest; do
            rm -f "_priv/$b"
            ln -s "$GITHUB_WORKSPACE/$b" "_priv/$b"
            echo "🔗 _priv/$b -> $(readlink -f "_priv/$b")"
          done

          # clash_core 可能是私库克隆带出的残留目录：
          # 若直接用 ln -sf <dir> _priv/clash_core，ln 会把软链误建到目录「内部」(_priv/clash_core/clash_core)，
          # 导致 _priv/clash_core/clash 解析不到真实二进制。这里分两种情形处理：
          if [ -e "_priv/clash_core" ] && [ ! -L "_priv/clash_core" ]; then
            # 情形 A：_priv/clash_core 是残留真实目录 → 仅把真实二进制软链进去，保留其它内容
            ln -sf "$GITHUB_WORKSPACE/clash_core/clash" "_priv/clash_core/clash"
            echo "🔗 _priv/clash_core/clash -> $(readlink -f "_priv/clash_core/clash")"
          else
            # 情形 B：不存在或已是软链 → 整体软链到工作区的 clash_core 目录
            rm -f "_priv/clash_core"
            ln -s "$GITHUB_WORKSPACE/clash_core" "_priv/clash_core"
            echo "🔗 _priv/clash_core -> $(readlink -f "_priv/clash_core")"
          fi

          echo "--- 校验关键软链（仅展示，不因此失败）---"
          ls -la _priv/mihomo _priv/xcspeedtest _priv/clash_core/clash 2>&1 || true

      # === 步骤6：运行测速脚本（仅本分片，FROM_JSON 读取已抓取节点） ===
      - name: 智能网络配置 + 运行测速脚本
        timeout-minutes: 220
        working-directory: ${{ github.workspace }}/_priv
        env:
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          WARP_FOR_TCP: ${{ env.WARP_FOR_TCP }}
          WARP_FOR_SPEEDTEST: ${{ env.WARP_FOR_SPEEDTEST }}
          WARP_FOR_FINAL: ${{ env.WARP_FOR_FINAL }}
          DETAILED_SPEEDTEST_MODE: ${{ inputs.speedtest_mode || env.DETAILED_SPEEDTEST_MODE }}
          ENABLE_BANDWIDTH_FILTER: ${{ env.ENABLE_BANDWIDTH_FILTER }}
          ENABLE_TCP_LOG: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tcp_log || env.ENABLE_TCP_LOG }}
          ENABLE_SPEEDTEST_LOG: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_speedtest_log || env.ENABLE_SPEEDTEST_LOG }}
          ENABLE_SPEEDTEST_TABLES: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_speedtest_tables || env.ENABLE_SPEEDTEST_TABLES }}
          # —— 两阶段：本分片从抓取阶段导出的 JSON 载入节点，不再连接 Telegram ——
          FROM_JSON: "true"
          # —— 矩阵分片参数（方案 E）—— 脚本据此只测本片节点 ——
          SHARD_TOTAL: ${{ inputs.shard_total || env.SHARD_TOTAL }}
          SHARD_INDEX: ${{ matrix.shard }}
          # —— 方案 C：外层并发上限（公开库 4vCPU 建议 16–24）——
          MAX_TEST_WORKERS: "20"
        run: |
          echo "=== 开始执行测速脚本（分片 ${{ matrix.shard }}/${SHARD_TOTAL}，FROM_JSON 载入节点）==="
          set -a; . TelegramNode/.secrets.env; set +a
          if [ -n "$TELEGRAM_STRING_SESSION" ]; then echo "::add-mask::$TELEGRAM_STRING_SESSION"; fi
          if [ -n "$ART_PASS" ]; then echo "::add-mask::$ART_PASS"; fi
          mkdir -p flclashyaml nodes_cache
          if [ ! -f "nodes_cache/all_nodes.json" ]; then
            echo "❌ 错误：未找到 nodes_cache/all_nodes.json（scrape 阶段产物缺失）"
            echo "   调试：nodes_cache/ 目录内容："; ls -la nodes_cache/ 2>/dev/null || true
            exit 1
          fi
          # 工具链：pylibs 与二进制在工作区根，通过 PYTHONPATH/PATH + 软链提供
          export PYTHONPATH="$GITHUB_WORKSPACE/pylibs"
          export PATH="$GITHUB_WORKSPACE/pylibs/bin:$GITHUB_WORKSPACE:$PATH"
          python3 TelegramNode/TG-Link.All.Test.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ 节点测速完成（分片 ${{ matrix.shard }}）"
            FOUND=0
            for f in flclashyaml/TelePuliclink-Check.yaml flclashyaml/TelePuliclink-Node.yaml flclashyaml/TelePuliclink-20MB.yaml flclashyaml/TelePuliclink-10MB.yaml; do
              if [ -f "$f" ]; then
                FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "unknown")
                echo "📁 配置文件生成成功: $f (${FILE_SIZE} bytes)"
                FOUND=1
              fi
            done
            if [ $FOUND -eq 0 ]; then
              echo "⚠️  本分片未生成配置文件（可能该片无节点）"
            fi
          else
            echo "❌ Python脚本执行失败，退出码: $EXIT_CODE"
            exit $EXIT_CODE
          fi

      # === 步骤7：确保网络正常 ===
      - name: 确保网络正常
        if: always()
        run: |
          echo "=== 🔧 确保网络正常（分片 ${{ matrix.shard }}）==="
          sudo wg-quick down wgcf 2>/dev/null || echo "   ℹ️ WARP未运行"
          sudo ip link delete wgcf 2>/dev/null || echo "   ℹ️ 接口不存在"
          for cidr in \
            "140.82.112.0/20" "185.199.108.0/22" "185.199.109.0/22" \
            "185.199.110.0/22" "185.199.111.0/22" "192.30.252.0/22" \
            "192.30.253.0/22" "192.30.254.0/22" "192.30.255.0/22"; do
            sudo ip route del $cidr 2>/dev/null || true
          done
          CURRENT_IP=""
          for server in "https://ip.sb" "https://api.ipify.org" "https://checkip.amazonaws.com" "https://ipinfo.io/ip"; do
            if CURRENT_IP=$(curl -4 -s --max-time 5 "$server" | grep -E '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'); then
              echo "   ✅ 成功: $CURRENT_IP "
              break
            fi
          done
          if [ -z "$CURRENT_IP" ]; then
            CURRENT_IP=$(hostname -I | awk '{print $1}' 2>/dev/null || echo "unknown")
            echo "   ℹ️ 备用IP: $CURRENT_IP"
          fi
          echo "=== 网络检查完成 ==="

      # === 步骤8：打包并上传分片产物（供 merge job 汇总；内容与 Gist 公开内容一致） ===
      - name: 打包分片产物
        if: always()
        run: |
          mkdir -p payload/flclashyaml
          if [ -d _priv/flclashyaml ]; then
            cp -r _priv/flclashyaml/. payload/flclashyaml/ 2>/dev/null || true
          fi
          # 把本片产生的 ip_cache.json 原样打包（无论它在私库的哪一级目录）
          IC=$(find _priv -name ip_cache.json -not -path '*/.git/*' -not -path './payload/*' | head -n1)
          if [ -n "$IC" ]; then
            REL="${IC#_priv/}"
            mkdir -p "payload/$(dirname "$REL")"
            cp "$IC" "payload/$REL"
            echo "📦 打包 ip_cache: $REL"
          else
            echo "ℹ️ 本分片未发现 ip_cache.json"
          fi
          # 必须用确定路径 _priv/TelegramNode/speed_cache.json，不能再用 find|head -n1：
          # 若 flclashyaml/ 下存在 stray 空 speed_cache.json，find 会优先命中它，
          # 导致真正的缓存（TelegramNode/）反而未被打包 → 跨分片带宽数据丢失。
          if [ -f "_priv/TelegramNode/speed_cache.json" ]; then
            mkdir -p payload/TelegramNode
            cp _priv/TelegramNode/speed_cache.json payload/TelegramNode/speed_cache.json
            echo "📦 打包 speed_cache: TelegramNode/speed_cache.json ($(wc -c < _priv/TelegramNode/speed_cache.json) bytes)"
          else
            echo "ℹ️ 本分片未发现 TelegramNode/speed_cache.json"
          fi
      - name: 上传分片产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: payload
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3) merge：等所有分片完成后，汇总 YAML + ip_cache，统一【回推私库】并同步 Gist
  # ---------------------------------------------------------------------------
  merge:
    name: 合并分片并回推私库
    needs: [prepare, speedtest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ✅ 仅 merge 挂 db-cache-commit：单一 job 负责统一回推，与「📌 构建IP缓存」
    #   workflow（请一并迁到公库 link）同一时刻仅一个在提交，避免冲突/覆盖。
    concurrency:
      group: db-cache-commit
      cancel-in-progress: false
    # 🔐 仅授予本 job 所需的最小 token 权限：
    #   actions: write → 删除本次运行 artifact（防公网下载，见末步）
    #   （回推私库走 PRIV_PAT，Gist 走 .secrets.env 的 GIST_TOKEN，均不依赖 GITHUB_TOKEN）
    permissions:
      actions: write
    steps:
      # === 步骤1：完整克隆私库（用于合并与回推） ===
      - name: 完整克隆私库 VPSscript
        env:
          PRIV_PAT: ${{ secrets.PRIV_PAT }}
        run: |
          git clone "https://x-access-token:${PRIV_PAT}@github.com/${PRIV_REPO}.git" _priv
          cd _priv && git checkout "${PRIV_BRANCH}" 2>/dev/null || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      # === 步骤2：安装 GitHub CLI（用于查询同库运行状态，防推送竞态） ===
      - name: 安装 GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt update
          sudo apt install gh -y
          gh --version

      # === 步骤3：安装合并所需全部依赖 ===
      - name: 设置 Python 环境并安装依赖
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r _priv/TelegramNode/requirements.txt

      # === 步骤4：下载所有分片产物 ===
      - name: 下载所有分片产物
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          merge-multiple: false
          path: .
      - name: 移入 _priv 供合并脚本读取
        run: |
          ls -d shard-* 2>/dev/null || echo "（无分片产物）"
          mv shard-* _priv/ 2>/dev/null || true

      # === 步骤5：合并分片文件（调用主脚本内置 merge 模式，cwd = _priv 根） ===
      - name: 合并分片文件
        working-directory: ${{ github.workspace }}/_priv
        env:
          MERGE_SHARDS: "true"
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          WARP_FOR_FINAL: ${{ env.WARP_FOR_FINAL }}
        run: |
          echo "📥 已下载分片目录："
          ls -d shard-* 2>/dev/null || echo "（无分片产物）"
          python TelegramNode/TG-Link.All.Test.py

      # === 步骤6：清理分片临时目录（避免误提交） ===
      - name: 清理分片临时目录
        run: rm -rf _priv/shard-* || true

      # === 步骤7：回推全部产物到私库（含与其它运行的推送竞态处理） ===
      - name: 回推产物到私库 VPSscript
        working-directory: ${{ github.workspace }}/_priv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 等待公库同分支其它运行结束（本 workflow 已被 db-cache-commit 串行化，
          # 此处主要防与「📌 构建IP缓存」等其它 workflow 的推送竞态）
          for i in $(seq 1 30); do
            RUNNING=$(gh api "repos/${{ github.repository }}/actions/runs?branch=${{ env.PRIV_BRANCH }}&per_page=100" \
              -q '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length' 2>/dev/null) || RUNNING=0
            RUNNING=${RUNNING:-0}
            if [ "$RUNNING" -le 1 ]; then break; fi
            echo "⏳ 检测到 $RUNNING 个运行未结束，等待... ($((i*20))s/600s)"
            sleep 20
          done
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更，跳过提交与推送"
          else
            git commit -m "🚀 (Auto-Update) 更新节点与调试文件 $(date -u +%FT%TZ)"
          fi
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin "${PRIV_BRANCH}"
            BEHIND=$(git rev-list --count "HEAD..origin/${PRIV_BRANCH}" 2>/dev/null || echo 0)
            if [ "${BEHIND:-0}" -gt 0 ]; then
              echo "ℹ️ 私库远端领先 ${BEHIND} 个提交，rebase 后再推"
              git pull --rebase --autostash origin "${PRIV_BRANCH}" || {
                git rebase --abort 2>/dev/null || true
                git pull --no-rebase --autostash origin "${PRIV_BRANCH}" || true
              }
            fi
            if git push origin "HEAD:${PRIV_BRANCH}"; then
              PUSH_OK=1; echo "✅ 产物已回推私库 ${PRIV_REPO}"; break
            fi
            echo "⚠️ push 失败（远端有新提交），重试 $i/5"; sleep 20
          done
          if [ "$PUSH_OK" -ne 1 ]; then echo "❌ 回推私库失败（5 次重试均失败）"; exit 1; fi
          git log --oneline -3

      # === 步骤8：同步 flclashyaml 目录下指定的 YAML 文件到 Gist（订阅地址不变） ===
      - name: 同步文件夹下指定 YAML 文件到 Gist
        env:
          VAR_GIST_ID: ${{ vars.GIST_ID }}   # 兜底：也可在公库 Variables 里配 GIST_ID
        run: |
          echo "=== 开始筛选并同步 YAML 文件到 Gist ==="
          # GIST_TOKEN / GIST_ID 均来自私库 .secrets.env（公库无需单独配置 secret）
          set -a; . _priv/TelegramNode/.secrets.env; set +a
          if [ -n "$GIST_TOKEN" ]; then echo "::add-mask::$GIST_TOKEN"; fi
          GIST_ID="${GIST_ID:-$VAR_GIST_ID}"
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "⚠️ 未配置 GIST_TOKEN 或 GIST_ID（.secrets.env / 公库 Variables 均未提供），跳过同步。"
            exit 0
          fi
          USER_NAME="${GIST_USER}"

          PAYLOAD_FILE=$(mktemp)
          echo '{"files": {}}' > "$PAYLOAD_FILE"

          FILE_LIST=$(find _priv/flclashyaml -type f \( -name "*.yaml" -o -name "*.yml" \) \
                      ! -name "node_ipconfig.yaml" \
                      ! -name "node_ipconfig_rename.yaml")

          if [ -z "$FILE_LIST" ]; then
            echo "⚠️ 没有符合条件的 YAML 文件需要上传。"
            exit 0
          fi

          while IFS= read -r filepath; do
            raw_filename=${filepath#_priv/flclashyaml/}
            filename=$(echo "$raw_filename" | sed 's/\//_/g')
            filesize=$(stat -c%s "$filepath" 2>/dev/null || stat -f%z "$filepath" 2>/dev/null || echo 0)
            echo "正在处理: $filename ($filesize bytes)"
            jq --arg name "$filename" --rawfile content "$filepath" \
               '.files[$name] = {content: $content}' "$PAYLOAD_FILE" > tmp.json && mv tmp.json "$PAYLOAD_FILE"
          done <<< "$FILE_LIST"

          echo "🚀 正在上传到 Gist..."
          MAX_RETRIES=2
          ATTEMPT=0
          SUCCESS=0
          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "👉 第 $ATTEMPT 次尝试..."
            http_code=$(curl -s -o response.json -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Content-Type: application/json" \
              -d @"$PAYLOAD_FILE" \
              "https://api.github.com/gists/$GIST_ID")
            if [ "$http_code" = "200" ]; then
              SUCCESS=1
              break
            fi
            if [[ "$http_code" =~ ^(500|502|503|504)$ ]]; then
              if [ $ATTEMPT -le $MAX_RETRIES ]; then
                sleep_sec=$((ATTEMPT * 3))
                echo "⚠️ Gist 暂时不可用 ($http_code)，${sleep_sec}s 后重试..."
                sleep $sleep_sec
              fi
            else
              echo "❌ 错误：Gist 返回 HTTP $http_code"
              cat response.json
              rm -f response.json "$PAYLOAD_FILE"
              exit 1
            fi
          done
          if [ $SUCCESS -eq 1 ]; then
            echo "✅ 指定文件同步成功！"
            echo "🔗 订阅链接 (Raw URL)：与原先完全一致"
            while IFS= read -r filepath; do
              raw_filename=${filepath#_priv/flclashyaml/}
              filename=$(echo "$raw_filename" | sed 's/\//_/g')
              url_filename=$(echo "$filename" | sed 's/ /%20/g')
              echo "📄 $raw_filename -> https://gist.githubusercontent.com/$USER_NAME/$GIST_ID/raw/$url_filename"
            done <<< "$FILE_LIST"
          else
            echo "❌ 同步失败，已达到最大重试次数。"
            exit 1
          fi
          rm -f response.json "$PAYLOAD_FILE"

      # === 步骤9：清理本次运行全部 artifact（最后一个消费者 merge 跑完后删除，防公网下载）===
      #   覆盖节点缓存(nodes-cache)、工具链(toolchain)、各分片(shard-*) 全部 artifact。
      #   nodes_cache 即便已用 ART_PASS AES-256 加密，shard-* 仍为明文，故必须删。
      - name: 🧹 清理本次运行全部 artifact（防公开下载）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          echo "🧹 清理本次运行 (run_id=${RUN_ID}) 的全部 artifact..."
          IDS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[].id' 2>/dev/null || true)
          if [ -z "$IDS" ]; then
            echo "✅ 没有需要清理的 artifact。"
          else
            for id in $IDS; do
              if gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" >/dev/null 2>&1; then
                echo "  🗑️ 已删除 artifact id=${id}"
              else
                echo "  ⚠️ 删除 artifact id=${id} 失败（可能已过期）"
              fi
            done
            echo "✅ 全部 artifact 清理完成。"
          fi
