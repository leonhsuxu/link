# 版本：V01.r1（手动运行分片=10，自动运行分片=15）
name: 📚 [Gist]Publiclink.All.Test_多版本
# ==================== 触发条件配置 ====================
# TCP、Clash、XCspeedtest 三合一测速版
# 同步gitcode
#
# 🧩 矩阵分片版（方案 E + A + C，两阶段：抓取 / 测速分离）：
#   - prepare      ：根据 SHARD_TOTAL 生成矩阵 [0,1,...,N-1]
#   - scrape      ：【单 job】只抓取+解析+清洗+全局命名一次，导出 nodes_cache/all_nodes.json（artifact）
#                   彻底消除「多分片同时用同一 Telegram session 从不同 IP 登录 → session 被封」的问题
#   - speedtest   ：【矩阵 N 片】每片读取同一份 all_nodes.json，确定性切片后各自 IP 验证 + 测速 + 命名
#                   （不再抓 Telegram，故不再传 TELEGRAM_STRING_SESSION，根除 session 冲突）
#   - merge       ：等所有分片完成后，汇总 YAML + ip_cache，统一提交并同步 Gist
#   节点数（几千）越多，分片收益越大；抓取只发生一次。
on:
  # 定时执行配置北京时间5:27
  schedule:
    - cron: '27 21 * * *'
  # 支持手动触发工作流，附带输入参数
  workflow_dispatch:
    inputs:
      # 网络配置模式选择
      warp_config:
        description: '选择网络配置模式'
        required: false
        default: 'default'
        type: choice
        options:
          - default        # 默认配置
          - all_warp       # 全流程使用Warp网络
          - all_github     # 全流程使用GitHub网络
          - test_mode      # 测试模式：仅抓取部分频道，使用Warp测速
      # 是否强制重新下载工具（忽略缓存）
      force_download:
        description: '强制重下载工具'
        required: false
        default: false
        type: boolean
      # 测速模式选择（支持6种，详见说明）
      speedtest_mode:
        description: '选择测速模式'
        required: false
        default: 'tcp_clash_xc'
        type: choice
        options:
          - tcp_only         # 纯 TCP 测速
          - tcp_clash        # TCP 粗筛 → Clash 测速
          - clash_only       # 纯 Clash 测速
          - xcspeedtest_only # 备用 纯 Speedtest 测速（xcspeedtest）,超慢
          - tcp_xc           # 备用 TCP 粗筛 → Speedtest 测速，超慢
          - tcp_clash_xc     # 备用 TCP 粗筛 → Clash测速 → XC|Speedtest 测速
      # 手动运行时：是否启用TCP测速详细日志
      enable_tcp_log:
        description: '是否开启TCP日志'
        required: false
        default: false
        type: boolean
      # 手动运行时：是否启用测速详细日志（自动匹配测速模式）
      enable_speedtest_log:
        description: '是否显示测试日志'
        required: false
        default: false
        type: boolean
      # 手动运行时：是否输出测速表格
      enable_speedtest_tables:
        description: '是否显示测速结果'
        required: false
        default: false
        type: boolean
      # 手动运行时：分片数量（覆盖 env.SHARD_TOTAL）
      shard_total:
        description: '矩阵分片数量（并发 job 数）'
        required: false
        default: '20'
        type: string

# ==================== 并发控制（关键：保护 Telegram session）====================
# 同一个 STRING_SESSION 授权密钥不能从两个不同 IP 同时登录，否则 Telegram 会
# 直接作废该密钥，报错：
#   "The authorization key (session file) was used under two different IP
#    addresses simultaneously, and can no longer be used."
# 串行化整个工作流运行，确保任意时刻最多只有一个 scrape job 在连接 Telegram，
# 根除「定时触发 + 手动触发」或「上一次未跑完又触发」造成的同 session 并发冲突。
# ⚠️ 注意：本规则仅约束【本工作流文件】。请确认仓库内没有其它 workflow 文件
#   或本地进程同时使用同一个 TELEGRAM_STRING_SESSION，否则仍会冲突。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# ==================== 环境变量配置 ====================
env:
  # ==================== 版本配置 ====================
  WORKFLOW_VERSION: "V02.r1"         # 本工作流版本号（手动运行分片=10，自动运行分片=15）
  MIHOMO_VERSION: v1.19.21           # Mihomo (Clash Meta) 版本
  SPEEDTEST_VERSION: v0.4.17          # XC Speedtest 版本
  WGCF_VERSION: v2.3.0              # WGCF (Cloudflare Warp) 版本
  CLASH_SPEEDTEST_VERSION: v1.8.6    # Clash-speedtest 核心版本
  # ==================== 网络控制配置 默认网络配置====================
  # 这些变量是Python脚本的唯一控制源，控制各阶段是否使用Warp网络
  # true=使用Warp网络，false=使用原始GitHub网络

  # 抓取阶段：使用GitHub网络（速度快）
  WARP_FOR_SCRAPING: "false"
  # 订阅解析阶段：使用GitHub网络（兼容性好，适合反爬机场）
  WARP_FOR_PARSING: "true"
  # TCP测速阶段：使用Warp网络（模拟国内环境，测速结果更准确）
  WARP_FOR_TCP: "true"
  # Speedtest测速阶段：使用Warp网络（模拟国内环境，测速结果更准确）
  WARP_FOR_SPEEDTEST: "true"
  # 最终处理阶段：使用GitHub网络（确保提交等操作正常）
  WARP_FOR_FINAL: "false"

  # ==================== 测速策略配置 ====================
  # 测速模式选项：
  #   tcp_clash     → TCP 粗筛 → Clash 精测
  #   tcp_xc        → TCP 粗筛 → Speedtest 精测
  #   tcp_only      → 纯 TCP 测速（最快，最适合节点特别多的情况）
  #   clash_only    → 纯 Clash 测速（最准）
  #   xcspeedtest_only → 纯 xcspeedtest 测速
  #   tcp_clash_xc  → 先 TCP → 再 Clash → 最后 xcspeedtest（最全面，耗时最长）
  #SPEEDTEST_MODE: "tcp_first"       # 兼容原有配置，推荐使用 DETAILED_SPEEDTEST_MODE 覆盖；已删除
  DETAILED_SPEEDTEST_MODE: "tcp_xc"       # 定时运行的默认模式，覆盖全部测速选择：tcp_clash_xc, tcp_clash, tcp_xc, tcp_only, clash_only, xcspeedtest_only

  # ==================== 带宽筛选配置 ====================
  # 是否启用带宽筛选（True=启用，False=关闭），通过环境变量控制
  ENABLE_BANDWIDTH_FILTER: "true"
  # 最低带宽阈值（单位：MB/s），默认为20MB/s
  # MIN_BANDWIDTH_MB: "20"
  # ==================== 日志配置 ====================
  # 是否启用TCP测速详细日志（生产环境建议关闭）  false不开启，true开启
  ENABLE_TCP_LOG: "false"
  MAX_LOG_NUMBER: '50'   # 开启日志（默认只显示前 200 条）

  # 统一的测速日志开关（自动跟随测速模式显示Clash/xcspeedtest日志） false不开启，true开启
  ENABLE_SPEEDTEST_LOG: "false"
  # 是否启用speedtest测速日志表格（生产环境建议关闭）  # false不开启，true开启 只控制最终的漂亮 Markdown 表格
  #ENABLE_XCSPEEDTEST_TABLE: "false"
  # 是否启用测速结果表格（自动跟随测速模式显示对应表格）
  ENABLE_SPEEDTEST_TABLES: "false"  # 新增统一控制变量

  # ==================== 矩阵分片配置 ====================
  # 分片总数（并发 job 数）。GitHub 免费账号最多 20 个并发 job（Pro 80）。
  # 公开库 ubuntu-latest = 4 vCPU/16GB，建议 16–24；私有库 2 vCPU/8GB，建议 ≤16。
  # 手动运行时可用 workflow_dispatch 的 shard_total 覆盖（手动默认 20，自动默认 20）。
  SHARD_TOTAL: "20"

# ==================== 工作流任务定义 ====================
# ---------------------------------------------------------------------------
# 0) prepare：根据 SHARD_TOTAL 生成矩阵 [0,1,...,N-1]
# ---------------------------------------------------------------------------
jobs:
  prepare:
    name: 🧩 准备分片矩阵
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.gen.outputs.shard_matrix }}
    steps:
      - id: gen
        name: 生成分片矩阵
        run: |
          if [ -n "${{ inputs.shard_total }}" ]; then
            N="${{ inputs.shard_total }}"
          else
            N="${{ env.SHARD_TOTAL }}"
          fi
          N=$((N + 0))
          if [ "$N" -lt 1 ]; then N=1; fi
          # 生成 0,1,...,N-1
          arr=$(seq -s, 0 $((N - 1)))
          echo "shard_matrix=[$arr]" >> "$GITHUB_OUTPUT"
          echo "🧩 分片总数 SHARD_TOTAL=$N，矩阵=$arr"

  # ---------------------------------------------------------------------------
  # 1) scrape：单 job，只抓取一次 → 导出 all_nodes.json（供分片复用）
  # ---------------------------------------------------------------------------
  scrape:
    name: 抓取并导出节点
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v7
        with:
          # scrape 不依赖 git 历史，浅克隆即可，显著加快检出
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'TelegramNode/requirements.txt'
      - name: 缓存 apt 包（避免重复下载系统依赖）
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-wireguard-curl-wget-resolvconf-v1
          restore-keys: |
            apt-${{ runner.os }}-
      - name: 安装 Python 依赖及系统依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r TelegramNode/requirements.txt
          sudo mkdir -p /var/cache/apt/archives
          if [ -d "$RUNNER_TEMP/apt-archives" ]; then
            sudo cp -f "$RUNNER_TEMP/apt-archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools curl resolvconf wget
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo cp -f /var/cache/apt/archives/*.deb "$RUNNER_TEMP/apt-archives/" 2>/dev/null || true
      # scrape 只需 wgcf（Warp 用于抓取/解析），不需要 mihomo/xc/clash 测速内核
      - name: 缓存 wgcf 工具
        id: cache-wgcf
        uses: actions/cache@v6
        with:
          path: wgcf
          key: wgcf-linux-amd64-${{ env.WGCF_VERSION }}
          restore-keys: wgcf-linux-amd64-${{ env.WGCF_VERSION }}
      - name: 下载 wgcf 工具
        if: steps.cache-wgcf.outputs.cache-hit != 'true' || inputs.force_download == 'true'
        run: |
          WGCF_FULL_VERSION="${{ env.WGCF_VERSION }}"
          WGCF_FILENAME_VERSION="${WGCF_FULL_VERSION#v}"
          echo "正在下载 wgcf v${WGCF_FILENAME_VERSION}..."
          curl -fsSL -o wgcf "https://github.com/ViRb3/wgcf/releases/download/${WGCF_FULL_VERSION}/wgcf_${WGCF_FILENAME_VERSION}_linux_amd64"
          if [ ! -f "wgcf" ]; then
            echo "❌ 错误：wgcf 下载失败！"
            exit 1
          fi
          chmod +x wgcf
          echo "wgcf 下载完成。"
      - name: 抓取并导出节点（SCRAPE_ONLY）
        timeout-minutes: 110
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          # 下载解析并发数（订阅链接之间并行；默认 12，可按 runner 情况调）
          DOWNLOAD_WORKERS: "12"
          # 单个订阅 URL 的总时间预算（秒）：wget→curl→requests 三级兜底按剩余预算收缩超时，
          # 预算耗尽即放弃该 URL，防止个别慢源把整个抓取阶段拖到 10 分钟以上
          DOWNLOAD_URL_BUDGET: "150"
          # 单次请求超时（秒）
          DOWNLOAD_TIMEOUT: "90"
          WARP_FOR_SCRAPING: ${{ env.WARP_FOR_SCRAPING }}
          WARP_FOR_PARSING: ${{ env.WARP_FOR_PARSING }}
          DETAILED_SPEEDTEST_MODE: ${{ inputs.speedtest_mode || env.DETAILED_SPEEDTEST_MODE }}
        run: |
          echo "=== 阶段[scraping]：抓取全部频道并导出节点 JSON ==="
          mkdir -p nodes_cache
          if [ -f "TelegramNode/TG_Chanel_ID.txt" ]; then
            export TELEGRAM_CHANNEL_IDS=$(cat TelegramNode/TG_Chanel_ID.txt)
            echo "✅ 已从 TG_Chanel_ID.txt 读取频道列表"
          else
            echo "❌ 错误：TelegramNode/TG_Chanel_ID.txt 文件不存在！"
            exit 1
          fi
          # SCRAPE_ONLY=true：抓取+解析+清洗+全局命名后仅导出 nodes_cache/all_nodes.json 即返回
          SCRAPE_ONLY=true python TelegramNode/TG-Link.All.Test.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ 抓取阶段失败，退出码: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          if [ ! -f "nodes_cache/all_nodes.json" ]; then
            echo "❌ 未生成 nodes_cache/all_nodes.json，抓取可能无节点"
            exit 1
          fi
          echo "✅ 抓取完成，节点数：$(python -c "import json;print(len(json.load(open('nodes_cache/all_nodes.json'))))")"
      - name: 确保网络正常
        if: always()
        run: |
          echo "=== 🔧 确保网络正常（scrape）==="
          sudo wg-quick down wgcf 2>/dev/null || echo "   ℹ️ WARP未运行"
          sudo ip link delete wgcf 2>/dev/null || echo "   ℹ️ 接口不存在"
          for cidr in \
            "140.82.112.0/20" "185.199.108.0/22" "185.199.109.0/22" \
            "185.199.110.0/22" "185.199.111.0/22" "192.30.252.0/22" \
            "192.30.253.0/22" "192.30.254.0/22" "192.30.255.0/22"; do
            sudo ip route del $cidr 2>/dev/null || true
          done
          echo "=== 网络检查完成 ==="
      - name: 上传节点缓存（供分片复用）
        uses: actions/upload-artifact@v7
        with:
          name: nodes-cache
          path: nodes_cache
          if-no-files-found: error
          retention-days: 1



  # ---------------------------------------------------------------------------
  # 1.5) setup：单 job，构建一次「工具链」（Python 依赖 + mihomo/wgcf/xcspeedtest/
  #      clash-speedtest 四个二进制），打包为 artifact 供所有测速分片共享。
  #      目的：消除「每个分片重复 pip install + 下载 4 个二进制」的 20× 冗余与
  #      GitHub API 限流风险；抓取仍只在 scrape 单次完成，从源头避免 TG 并发封禁。
  # ---------------------------------------------------------------------------
  setup:
    name: 构建共享工具链
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: 缓存 apt 包（避免重复下载系统依赖）
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-wireguard-curl-wget-resolvconf-v1
          restore-keys: |
            apt-${{ runner.os }}-
      - name: 安装系统工具（wg-quick / curl 等）
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d "$RUNNER_TEMP/apt-archives" ]; then
            sudo cp -f "$RUNNER_TEMP/apt-archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools curl resolvconf wget
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo cp -f /var/cache/apt/archives/*.deb "$RUNNER_TEMP/apt-archives/" 2>/dev/null || true
      - name: 安装 Python 依赖到 pylibs（--target，便于跨 runner 移植）
        run: |
          python3 -m pip --version || sudo apt-get install -y python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install --target=pylibs -r TelegramNode/requirements.txt
      - name: 下载 Mihomo
        run: |
          set -e
          TAG=${{ env.MIHOMO_VERSION }}
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-${TAG}.gz"
          if ! curl --head --fail "$URL"; then echo "❌ Mihomo 下载地址不可用"; exit 1; fi
          wget --tries=3 --timeout=30 -O mihomo.gz "$URL"
          gunzip -f mihomo.gz && chmod +x mihomo && ./mihomo -v
      - name: 下载 wgcf
        run: |
          WGCF_FULL_VERSION="${{ env.WGCF_VERSION }}"
          WGCF_FILENAME_VERSION="${WGCF_FULL_VERSION#v}"
          curl -fsSL -o wgcf "https://github.com/ViRb3/wgcf/releases/download/${WGCF_FULL_VERSION}/wgcf_${WGCF_FILENAME_VERSION}_linux_amd64"
          chmod +x wgcf
      - name: 下载 xcspeedtest (speedtest-clash)
        run: |
          set -e
          RELEASE_TAG=${{ env.SPEEDTEST_VERSION }}
          URL=$(curl -s "https://api.github.com/repos/xiecang/speedtest-clash/releases/tags/${RELEASE_TAG}" \
                | grep "browser_download_url.*speedtest-clash_Linux_x86_64" | cut -d '"' -f4)
          if [ -z "$URL" ]; then
            URL=$(curl -s https://api.github.com/repos/xiecang/speedtest-clash/releases/latest \
                | grep "browser_download_url.*speedtest-clash_Linux_x86_64" | cut -d '"' -f4)
          fi
          if [ -z "$URL" ]; then echo "❌ 未找到 speedtest-clash 下载 URL"; exit 1; fi
          wget --tries=5 --timeout=60 -O downloaded_file "$URL"
          if file downloaded_file | grep -q "gzip compressed data"; then
            tar -xzf downloaded_file && mv speedtest-clash xcspeedtest && rm downloaded_file
          else
            mv downloaded_file xcspeedtest
          fi
          chmod +x xcspeedtest && ./xcspeedtest --help
      - name: 下载 clash-speedtest 核心
        run: |
          mkdir -p clash_core
          URL="https://github.com/faceair/clash-speedtest/releases/download/${{ env.CLASH_SPEEDTEST_VERSION }}/clash-speedtest_Linux_x86_64.tar.gz"
          wget -q -O clash-speedtest.tar.gz "$URL"
          tar -xzf clash-speedtest.tar.gz -C clash_core
          rm -f clash-speedtest.tar.gz
          mv clash_core/clash-speedtest clash_core/clash && chmod +x clash_core/clash
      - name: 打包工具链
        run: |
          tar -czf toolchain.tar.gz pylibs mihomo wgcf xcspeedtest clash_core
          ls -lh toolchain.tar.gz
      - name: 上传工具链 artifact
        uses: actions/upload-artifact@v7
        with:
          name: toolchain
          path: toolchain.tar.gz
          if-no-files-found: error
          retention-days: 1
  # ---------------------------------------------------------------------------
  # 2) speedtest：矩阵并行测速，每片只测自己那一份节点，产物上传为 artifact
  # ---------------------------------------------------------------------------
  speedtest:
    name: 测速分片 ${{ matrix.shard }}
    needs: [prepare, scrape, setup]
    runs-on: ubuntu-latest
    # 单分片只处理 1/N 节点，耗时远低于整跑；留足余量即可。
    timeout-minutes: 240
    # ⚠️ 不再在此 job 上挂 db-cache-commit：矩阵分片要并行，
    #   否则并发组会把 20 个分片串行排队，分片失去意义。
    #   只有最后的 merge job 挂 db-cache-commit，负责统一提交 ip_cache.json，
    #   从而与「📌 构建IP缓存」workflow 互斥。
    strategy:
      fail-fast: false   # 单个分片失败不影响其余分片
      max-parallel: 20   # 20 个 speedtest 分片并发 = 免费账号 20 并发上限（prepare/scrape/setup/merge 均在其前后串行，峰值仅 20 个 speedtest job）
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shard_matrix) }}
    steps:
      # === 步骤1：检出代码仓库 ===
      - name: 检出代码仓库
        uses: actions/checkout@v7
        with:
          # 测速分片不提交代码，仅需脚本与依赖，浅克隆即可加快检出
          fetch-depth: 1
          # 使用GitHub Token认证（需要读取 workflow 运行状态）
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
      # === 步骤2：恢复共享工具链（由 setup job 构建一次，全分片复用）===
      # 💡 原「每分片各自 pip install + 下载 4 个二进制」已被移除：20 个分片并行
      #    打 GitHub API 取 xcspeedtest 链接会触发限流，且重复下载极耗时。现统一在
      #    setup 构建 toolchain.tar.gz，本处仅解包即用。
      - name: 下载并解包共享工具链
        uses: actions/download-artifact@v8
        with:
          name: toolchain
          path: .
      - name: 解包工具链（pylibs + 二进制，置于仓库根）
        run: |
          tar -xzf toolchain.tar.gz
          rm -f toolchain.tar.gz
          python3 -c "import sys; print('python', sys.version.split()[0])"
          ls -la mihomo wgcf xcspeedtest clash_core/clash 2>/dev/null || true
      # === 步骤3：仅补装系统级工具（wireguard-tools 提供 wg-quick；curl/wget/resolvconf
      #    供网络检查步骤）。系统包无法打进 tarball，但体积小、秒级完成，与
      #    「装依赖/xc 不分片」诉求（消除 20× 重型下载）不冲突。===
      - name: 缓存 apt 包（避免重复下载系统依赖）
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ runner.os }}-wireguard-curl-wget-resolvconf-v1
          restore-keys: |
            apt-${{ runner.os }}-
      - name: 安装系统级工具
        run: |
          sudo mkdir -p /var/cache/apt/archives
          if [ -d "$RUNNER_TEMP/apt-archives" ]; then
            sudo cp -f "$RUNNER_TEMP/apt-archives"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools curl resolvconf wget
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo cp -f /var/cache/apt/archives/*.deb "$RUNNER_TEMP/apt-archives/" 2>/dev/null || true
      # === 步骤13：下载抓取阶段导出的节点缓存 ===
      - name: 下载节点缓存（scrape 产物）
        uses: actions/download-artifact@v8
        with:
          name: nodes-cache
          path: .
      # === 步骤14：运行测速脚本（仅本分片，FROM_JSON 读取已抓取节点）===
      - name: 智能网络配置 + 运行测速脚本
        # ⚠️ 步骤级超时：单分片只测 1/N 节点，耗时远小于整跑；
        #    留 220 分钟上限（< job 级 240），给网络恢复留余量。
        timeout-minutes: 220 # 防止WARP启动卡死 + 容纳单分片 xcspeedtest 实测
        env:
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          WARP_FOR_TCP: ${{ env.WARP_FOR_TCP }}
          WARP_FOR_SPEEDTEST: ${{ env.WARP_FOR_SPEEDTEST }}
          WARP_FOR_FINAL: ${{ env.WARP_FOR_FINAL }}
          DETAILED_SPEEDTEST_MODE: ${{ inputs.speedtest_mode || env.DETAILED_SPEEDTEST_MODE }}
          ENABLE_BANDWIDTH_FILTER: ${{ env.ENABLE_BANDWIDTH_FILTER }}
          ENABLE_TCP_LOG: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_tcp_log || env.ENABLE_TCP_LOG }}
          ENABLE_SPEEDTEST_LOG: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_speedtest_log || env.ENABLE_SPEEDTEST_LOG }}
          ENABLE_SPEEDTEST_TABLES: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_speedtest_tables || env.ENABLE_SPEEDTEST_TABLES }}
          # —— 两阶段：本分片从抓取阶段导出的 JSON 载入节点，不再连接 Telegram ——
          FROM_JSON: "true"
          # —— 矩阵分片参数（方案 E）—— 脚本据此只测本片节点 ——
          SHARD_TOTAL: ${{ inputs.shard_total || env.SHARD_TOTAL }}
          SHARD_INDEX: ${{ matrix.shard }}
          # —— 方案 C：外层并发上限（公开库 4vCPU 建议 16–24；私有库 ≤16）——
          MAX_TEST_WORKERS: "20"
        run: |
          echo "=== 开始执行测速脚本（分片 ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}，FROM_JSON 载入节点）==="
          mkdir -p flclashyaml nodes_cache
          # 兼容两种 artifact 布局：目录包裹（nodes_cache/all_nodes.json）或扁平（all_nodes.json）
          if [ ! -f "nodes_cache/all_nodes.json" ]; then
            if [ -f "all_nodes.json" ]; then
              cp all_nodes.json nodes_cache/all_nodes.json
              echo "ℹ️ 已从扁平布局 all_nodes.json 还原到 nodes_cache/"
            else
              echo "❌ 错误：未找到 nodes_cache/all_nodes.json（scrape 阶段产物缺失）"
              echo "   调试：nodes_cache/ 目录内容："; ls -la nodes_cache/ 2>/dev/null || true
              echo "   调试：工作区根 all_nodes.json 是否存在："; ls -la all_nodes.json 2>/dev/null || true
              exit 1
            fi
          fi
          # 调用您的Python脚本（FROM_JSON=true 时脚本内部跳过抓取，仅切片+测速+命名）
          export PYTHONPATH=./pylibs
          export PATH="./pylibs/bin:$PATH"
          python3 TelegramNode/TG-Link.All.Test.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ 节点测速完成（分片 ${{ matrix.shard }}）"
            FOUND=0
            for f in flclashyaml/TelePuliclink-Check.yaml flclashyaml/TelePuliclink-Node.yaml flclashyaml/TelePuliclink-20MB.yaml flclashyaml/TelePuliclink-10MB.yaml; do
              if [ -f "$f" ]; then
              FILE_SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "unknown")
              echo "📁 配置文件生成成功: $f (${FILE_SIZE} bytes)"
              FOUND=1
           fi
           done
           if [ $FOUND -eq 0 ]; then
             echo "⚠️  本分片未生成配置文件（可能该片无节点）"
           fi
          else
            echo "❌ Python脚本执行失败，退出码: $EXIT_CODE"
            exit $EXIT_CODE
          fi
      # === 步骤15：确保网络正常（重要修复）===
      - name: 确保网络正常
        if: always()
        run: |
          echo "=== 🔧 确保网络正常（分片 ${{ matrix.shard }}）==="
          echo "1️⃣ 停止任何Warp连接..."
          sudo wg-quick down wgcf 2>/dev/null || echo "   ℹ️ WARP未运行"
          sudo ip link delete wgcf 2>/dev/null || echo "   ℹ️ 接口不存在"

          echo "2️⃣ 清除Warp相关路由..."
          for cidr in \
            "140.82.112.0/20" "185.199.108.0/22" "185.199.109.0/22" \
            "185.199.110.0/22" "185.199.111.0/22" "192.30.252.0/22" \
            "192.30.253.0/22" "192.30.254.0/22" "192.30.255.0/22"; do
            sudo ip route del $cidr 2>/dev/null || true
          done
          echo "3️⃣ 测试网络连接..."
          CURRENT_IP=""
          for server in "https://ip.sb" "https://api.ipify.org" "https://checkip.amazonaws.com" "https://ipinfo.io/ip"; do
            if CURRENT_IP=$(curl -4 -s --max-time 5 "$server" | grep -E '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'); then
              echo "   ✅ 成功: $CURRENT_IP "
              break
            fi
          done
          if [ -z "$CURRENT_IP" ]; then
            CURRENT_IP=$(hostname -I | awk '{print $1}' 2>/dev/null || echo "unknown")
            echo "   ℹ️ 备用IP: $CURRENT_IP"
          fi
          echo "4️⃣ 检查GitHub连接..."
          if curl -I --silent --max-time 10 https://github.com 2>/dev/null | head -1; then
            echo "   ✅ GitHub连接正常"
          else
            echo "   ⚠️  GitHub连接可能有问题"
          fi
          echo "=== 网络检查完成 ==="
      # === 步骤16：打包并上传分片产物（供 merge job 汇总）===
      - name: 打包分片产物
        if: always()
        run: |
          mkdir -p payload/flclashyaml
          if [ -d flclashyaml ]; then
            cp -r flclashyaml/. payload/flclashyaml/ 2>/dev/null || true
          fi
          # 把本片产生的 ip_cache.json 原样打包（无论它在仓库的哪一级目录）
          IC=$(find . -name ip_cache.json -not -path './payload/*' -not -path './.git/*' | head -n1)
          if [ -n "$IC" ]; then
            REL="${IC#./}"
            mkdir -p "payload/$(dirname "$REL")"
            cp "$IC" "payload/$REL"
            echo "📦 打包 ip_cache: $IC"
          else
            echo "ℹ️ 本分片未发现 ip_cache.json"
          fi
          # 把本片产生的 speed_cache.json 原样打包（带宽缓存，否则分片写入随 runner 销毁，
          # 仓库里永远是陈旧缓存，「2/7 天复测周期」空转）。
          # ⚠️ 必须用确定路径 TelegramNode/speed_cache.json，不能再用 find|head -n1：
          #    若 flclashyaml/ 下存在 stray 空 speed_cache.json，find 会优先命中它，
          #    导致真正的缓存（TelegramNode/）反而未被打包 → 跨分片带宽数据丢失。
          if [ -f "TelegramNode/speed_cache.json" ]; then
            mkdir -p payload/TelegramNode
            cp TelegramNode/speed_cache.json payload/TelegramNode/speed_cache.json
            echo "📦 打包 speed_cache: TelegramNode/speed_cache.json ($(wc -c < TelegramNode/speed_cache.json) bytes)"
          else
            echo "ℹ️ 本分片未发现 TelegramNode/speed_cache.json"
          fi
      - name: 上传分片产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: payload
          if-no-files-found: ignore
          retention-days: 1   # 仅用于本次运行 merge，过期即清

  # ---------------------------------------------------------------------------
  # 3) merge：等所有分片完成后，汇总 YAML + ip_cache，统一提交并同步 Gist
  # ---------------------------------------------------------------------------
  merge:
    name: 合并分片并提交
    needs: [prepare, speedtest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ✅ 仅在 merge 上挂 db-cache-commit：单一 job 负责提交 ip_cache.json，
    #   与「📌 构建IP缓存」workflow 互斥（cancel-in-progress: false → 排队不取消）。
    #   矩阵分片本身不挂此组，从而可以真正并行。
    concurrency:
      group: db-cache-commit
      cancel-in-progress: false
    # 🔐 仅授予本 job 所需的最小 token 权限（覆盖默认 scope，显式且可审计）：
    #   contents: write → 自动提交 YAML 到本仓库（leonhsuxu/link）
    #   actions:  write → 删除本次运行 artifact（防公网下载）
    permissions:
      contents: write
      actions: write
    steps:
      # === 步骤1：检出代码仓库 ===
      - name: 检出代码仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
      # === 步骤1.5：安装 GitHub CLI ===
      - name: 安装 GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt update
          sudo apt install gh -y
          gh --version
      # === 步骤2：设置 Python 环境 ===
      - name: 设置 Python 环境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # === 步骤3：安装合并所需全部依赖（merge 模式会加载主模块，需 telethon/requests 等）===
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r TelegramNode/requirements.txt
      # === 步骤4：下载所有分片产物 ===
      - name: 下载所有分片产物
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          merge-multiple: false
          path: .
      # === 步骤5：合并产物保留（TCP.yaml/clash.yaml/speedtest.yaml 现已被脚本纳入合并白名单，
      #            属最终交付文件，index.html 也列出它们，故【不再删除】，交由步骤6合并、步骤9提交）===
      - name: 保留合并产物（不再清理 TCP/clash/speedtest）
        run: echo "ℹ️ TCP.yaml/clash.yaml/speedtest.yaml 已作为合并产物保留，交由 _merge_yaml_shards 汇总"
      # === 步骤6：合并分片文件（调用主脚本内置 merge 模式）===
      - name: 合并分片文件
        env:
          MERGE_SHARDS: "true"
        run: |
          echo "📥 已下载分片目录："
          ls -d shard-* 2>/dev/null || echo "（无分片产物）"
          python TelegramNode/TG-Link.All.Test.py
      # === 步骤7：清理分片临时目录（避免误提交）===
      - name: 清理分片临时目录
        run: rm -rf shard-* || true
      # === 步骤8：同步远端分支（应对远端被force-push的情况）===
      - name: 同步远端分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 检查本地与远端是否分叉 ==="
          git fetch origin master
          LOCAL_COMMITS=$(git rev-list --count HEAD)
          REMOTE_COMMITS=$(git rev-list --count origin/master)
          echo "本地 commits: $LOCAL_COMMITS, 远端 commits: $REMOTE_COMMITS"

          check_running_workflows() {
            gh api repos/${{ github.repository }}/actions/runs \
              -F status=all \
              -F branch=master \
              --paginate \
              -q '.items[] | select(.status=="in_progress" or .status=="queued") | .id' 2>/dev/null | wc -l
          }
          wait_for_workflows() {
            local max_wait=$1
            local waited=0
            while [ $waited -lt $max_wait ]; do
              local running=$(check_running_workflows)
              if [ "$running" -eq 0 ]; then
                return 0
              fi
              echo "   等待中... ($((waited / 6))分钟/$((max_wait / 60))分钟)"
              sleep 10
              waited=$((waited + 10))
            done
            return 1
          }

          MERGE_BASE=$(git merge-base HEAD origin/master 2>/dev/null || echo "")
          LOCAL_AHEAD=$(git rev-list --count "$MERGE_BASE"..HEAD 2>/dev/null || echo 0)
          REMOTE_AHEAD=$(git rev-list --count "$MERGE_BASE"..origin/master 2>/dev/null || echo 0)
          if [ -z "$MERGE_BASE" ]; then
            echo "⚠️ 检测到严重分叉（无共同祖先）"
            RUNNING_JOBS=$(check_running_workflows)
            if [ "$RUNNING_JOBS" -gt 0 ]; then
              echo "⏳ 检测到 $RUNNING_JOBS 个 workflow 正在运行，等待完成（最多10分钟）..."
              if wait_for_workflows 600; then
                echo "✅ 所有 workflow 已完成"
              else
                echo "⚠️ 等待超时，继续处理"
              fi
            fi
            echo "🔄 重置本地到远端"
            git reset --hard origin/master
          elif [ "$LOCAL_AHEAD" -gt 0 ] && [ "$REMOTE_AHEAD" -gt 0 ]; then
            echo "⚠️ 检测到分叉（本地有未提交改动叠加远端新commit），尝试 pull --rebase（保留本地产物）"
            git pull --rebase --autostash origin master || {
              echo "⚠️ rebase 失败，等待其他 workflow 完成后重置到远端"
              RUNNING_JOBS=$(check_running_workflows)
              if [ "$RUNNING_JOBS" -gt 0 ]; then
                wait_for_workflows 600
              fi
              git fetch origin master
              git reset --hard origin/master
            }
          elif [ "$REMOTE_AHEAD" -gt 0 ]; then
            echo "ℹ️ 本地落后远端 $REMOTE_AHEAD 个 commit，reset --soft 快进到最新（保留本地产物）"
            # merge job 在此步之前尚未 git commit（提交由后续 auto-commit 完成），故无本地 commit，
            # reset --soft 仅移动分支引用、不动工作区，生成的 yaml/json 原样保留；
            # 随后 auto-commit 在 origin/master 最新 tip 之上提交 → push 快进成功。
            git fetch origin master
            git reset --soft origin/master || git merge --ff-only origin/master
          else
            echo "✓ 已是最新，继续"
          fi
          git status
      # === 步骤9：自动提交所有生成的YAML文件到GitHub ===
      - name: 自动提交所有生成的YAML文件
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "🚀 (Auto-Update) 更新节点与调试文件"
          # 🧩 矩阵分片后，所有分片产物已由 merge job 汇总到仓库根：
          #   flclashyaml/*.yaml + flclashyaml/*.json  —— 订阅与统计
          #   Database/*.json / TelegramNode/*.json —— 地理缓存 ip_cache.json / 带宽缓存 speed_cache.json
          #   （脚本经 from Database import ip_cache 写入，路径可能是
          #    Database/ip_cache.json 或 TelegramNode/Database/ip_cache.json，
          #    两种都覆盖，确保地理缓存被提交并跨运行复用）
          # ⚠️ 单文件真源 + 互斥：merge job 独占 db-cache-commit 并发组，
          #   与「📌 构建IP缓存」workflow 同一时刻仅一个在提交，避免冲突/覆盖。
          file_pattern: "flclashyaml/*.yaml flclashyaml/speedtest_url_stats.json flclashyaml/failed_urls.json Database/*.json TelegramNode/*.json"
      # === 步骤10：同步 flclashyaml 目录下指定的 YAML 文件到 Gist ===
      - name: 同步文件夹下指定 YAML 文件到 Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
          USER_NAME: ${{ github.actor }}
        run: |
          echo "=== 开始筛选并同步 YAML 文件到 Gist ==="
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "⚠️ 未配置 GIST_TOKEN 或 GIST_ID，跳过同步。"
            exit 0
          fi

          PAYLOAD_FILE=$(mktemp)
          echo '{"files": {}}' > "$PAYLOAD_FILE"

          FILE_LIST=$(find flclashyaml -type f \( -name "*.yaml" -o -name "*.yml" \) \
                      ! -name "node_ipconfig.yaml" \
                      ! -name "node_ipconfig_rename.yaml")

          if [ -z "$FILE_LIST" ]; then
            echo "⚠️ 没有符合条件的 YAML 文件需要上传。"
            exit 0
          fi

          while IFS= read -r filepath; do
            raw_filename=${filepath#flclashyaml/}
            filename=$(echo "$raw_filename" | sed 's/\//_/g')
            filesize=$(stat -c%s "$filepath" 2>/dev/null || stat -f%z "$filepath" 2>/dev/null || echo 0)
            echo "正在处理: $filename ($filesize bytes)"
            jq --arg name "$filename" --rawfile content "$filepath" \
               '.files[$name] = {content: $content}' "$PAYLOAD_FILE" > tmp.json && mv tmp.json "$PAYLOAD_FILE"
          done <<< "$FILE_LIST"

          echo "🚀 正在上传到 Gist..."
          MAX_RETRIES=2
          ATTEMPT=0
          SUCCESS=0
          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "👉 第 $ATTEMPT 次尝试..."
            http_code=$(curl -s -o response.json -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Content-Type: application/json" \
              -d @"$PAYLOAD_FILE" \
              "https://api.github.com/gists/$GIST_ID")
            if [ "$http_code" = "200" ]; then
              SUCCESS=1
              break
            fi
            if [[ "$http_code" =~ ^(500|502|503|504)$ ]]; then
              if [ $ATTEMPT -le $MAX_RETRIES ]; then
                sleep_sec=$((ATTEMPT * 3))
                echo "⚠️ Gist 暂时不可用 ($http_code)，${sleep_sec}s 后重试..."
                sleep $sleep_sec
              fi
            else
              echo "❌ 错误：Gist 返回 HTTP $http_code"
              cat response.json
              rm -f response.json "$PAYLOAD_FILE"
              exit 1
            fi
          done
          if [ $SUCCESS -eq 1 ]; then
            echo "✅ 指定文件同步成功！"
            echo "🔗 订阅链接 (Raw URL):"
            while IFS= read -r filepath; do
              raw_filename=${filepath#flclashyaml/}
              filename=$(echo "$raw_filename" | sed 's/\//_/g')
              url_filename=$(echo "$filename" | sed 's/ /%20/g')
              echo "📄 $raw_filename -> https://gist.githubusercontent.com/$USER_NAME/$GIST_ID/raw/$url_filename"
            done <<< "$FILE_LIST"
          else
            echo "❌ 同步失败，已达到最大重试次数。"
            exit 1
          fi
          rm -f response.json "$PAYLOAD_FILE"
      # === 步骤11：清理本次运行全部 artifact（最后一个消费者 merge 跑完后删除，防公网下载）===
      #   覆盖节点缓存(nodes-cache)、工具链(toolchain)、各分片(shard-*) 全部 artifact。
      #   nodes_cache 即便已用 ART_PASS AES-256 加密，shard-* 仍为明文，故必须删。
      - name: 🧹 清理本次运行全部 artifact（防公开下载）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          echo "🧹 清理本次运行 (run_id=${RUN_ID}) 的全部 artifact..."
          IDS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[].id' 2>/dev/null || true)
          if [ -z "$IDS" ]; then
            echo "✅ 没有需要清理的 artifact。"
          else
            for id in $IDS; do
              if gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" >/dev/null 2>&1; then
                echo "  🗑️ 已删除 artifact id=${id}"
              else
                echo "  ⚠️ 删除 artifact id=${id} 失败（可能已过期）"
              fi
            done
            echo "✅ 全部 artifact 清理完成。"
          fi
